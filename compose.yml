services:
  postgres:
    image: postgres:17
    container_name: charm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - charm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - charm-net

  redis:
    image: redis:7
    container_name: charm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - charm-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - charm-net

  flyway:
    image: flyway/flyway:11
    container_name: charm-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -url=${APP_DATASOURCE_URL}
      - -user=${APP_DATASOURCE_USERNAME}
      - -password=${APP_DATASOURCE_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./back/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - charm-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: charm-back
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_DATASOURCE_URL: ${APP_DATASOURCE_URL}
      APP_DATASOURCE_USERNAME: ${APP_DATASOURCE_USERNAME}
      APP_DATASOURCE_PASSWORD: ${APP_DATASOURCE_PASSWORD}
      APP_REDIS_HOST: ${APP_REDIS_HOST}
      APP_REDIS_PORT: ${APP_REDIS_PORT}
      APP_CONTENT_BASE_PATH: ${APP_CONTENT_BASE_PATH}
    volumes:
      - charm-content:${APP_CONTENT_BASE_PATH}
    networks:
      - charm-net

volumes:
  charm-postgres-data:
  charm-redis-data:
  charm-content:

networks:
  charm-net:
    driver: bridge
