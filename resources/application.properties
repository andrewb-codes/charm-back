# Base defaults (NO secrets). Override via profile/env/JVM props.
#
# --- Database (no password here)
app.datasource.url=jdbc:postgresql://localhost:5434/charm_repository
app.datasource.username=postgres
app.datasource.driver-class-name=org.postgresql.Driver
#
# Optional JDBC tuning
app.datasource.fetch-size=100
app.datasource.max-rows=1000
app.datasource.query-timeout=10
#
# Intentionally NO app.datasource.password
# Intentionally NO app.content.base-path
# These must be supplied by profile (e.g., application-local.properties)
# or by env/JVM properties: otherwise SetupCheck will fail fast at startup.