spring:
  application:
    name: charm-back
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 1800000
  data:
    redis:
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 0
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  messages:
    basename: words
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  redis:
    charm-queue-ttl-sec: 300
    charm-empty-ttl-sec: 60
    charm-lock-ttl-sec: 10
  jwt:
    access-token-ttl-min: 60

logging:
  level:
    root: INFO
    ru.andrewb.charm.back: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
