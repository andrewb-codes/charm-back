# Base defaults (NO secrets). Override via profile/env/JVM props.
#
# --- Active profile
app.profile.active=local
# --- Database (no password here)
app.datasource.url=jdbc:postgresql://localhost:5432/charm
app.datasource.username=charm
app.datasource.driver-class-name=org.postgresql.Driver
# Optional JDBC tuning
app.datasource.fetch-size=100
app.datasource.max-rows=1000
app.datasource.query-timeout=10
app.datasource.pool.size=10
# --- Cache (Redis)
app.redis.host=localhost
app.redis.port=6379
app.redis.charm-queue-ttl-sec=300
app.redis.charm-empty-ttl-sec=60
app.redis.charm-lock-ttl-sec=20
app.redis.timeout-ms=2000
app.redis.pool.max-total=16
app.redis.pool.max-idle=16
app.redis.pool.min-idle=0
app.redis.pool.test-on-borrow=true
# --- Feature Flags
app.ff.use-custom-pool=false
#
# Intentionally NO app.datasource.password
# Intentionally NO app.content.base-path
# These must be supplied by profile (e.g., application-local.properties)
# or by env/JVM properties: otherwise SetupCheck will fail fast at startup.