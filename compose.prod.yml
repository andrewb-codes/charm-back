services:
  postgres:
    image: postgres:17
    container_name: charm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - charm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - charm-net

  redis:
    image: redis:7
    container_name: charm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - charm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - charm-net

  app:
    image: andrewbcodes/charm-back:${APP_IMAGE_TAG:-latest}
    container_name: charm-back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED}
      APP_DATASOURCE_URL: ${APP_DATASOURCE_URL}
      APP_DATASOURCE_USERNAME: ${APP_DATASOURCE_USERNAME}
      APP_DATASOURCE_PASSWORD: ${APP_DATASOURCE_PASSWORD}
      APP_REDIS_HOST: ${APP_REDIS_HOST}
      APP_REDIS_PORT: ${APP_REDIS_PORT}
      APP_CONTENT_BASE_PATH: ${APP_CONTENT_BASE_PATH}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    volumes:
      - charm-content:${APP_CONTENT_BASE_PATH}
    networks:
      - charm-net

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: charm-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - charm-prometheus-data:/prometheus
    networks:
      - charm-net

  grafana:
    image: grafana/grafana:12.3.0
    container_name: charm-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - charm-grafana-data:/var/lib/grafana
    networks:
      - charm-net

volumes:
  charm-postgres-data:
  charm-redis-data:
  charm-content:
  charm-prometheus-data:
  charm-grafana-data:

networks:
  charm-net:
    driver: bridge
